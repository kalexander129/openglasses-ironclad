workflows:
  openglasses-ironclad:
    name: OpenGlasses IronClad
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Alfred

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ironclad.visionclaw
      vars:
        SCHEME: OpenGlasses
        DEVELOPMENT_TEAM_ID: "VLYY93HRG2"
        BUILD_NUMBER: "1"
        # Alfred OpenClaw Gateway
        ALFRED_GATEWAY_URL: "http://192.168.1.132:18789"
        OPENCLAW_HOST: "http://192.168.1.132"
        OPENCLAW_PORT: "18789"
        OPENCLAW_GATEWAY_TOKEN: "ef54338db231cbb6814f33b5adab687987494ed285fca503"
        # Local model endpoints
        VL72B_ENDPOINT: "http://192.168.1.136:8001/v1"
        DEEPSEEK_ENDPOINT: "http://192.168.1.137:8001/v1"
        GLM51_ENDPOINT: "https://flbsh4qgrq58n6-8000.proxy.runpod.net/v1"
        # Meta Wearables SDK (Kyle needs to fill these in)
        META_APP_ID: "YOUR_META_APP_ID"
        META_CLIENT_TOKEN: "AR|YOUR_META_APP_ID|YOUR_CLIENT_TOKEN_HASH"
      xcode: "26.0"
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
        - pattern: ironclad

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Strip on-device ML deps and source files
        script: |
          cd $CM_BUILD_DIR
          # Remove MLX/HF/SwiftTransformers package deps from project.base.yml
          # We use remote models — no on-device inference needed
          # This avoids the Swift Macro build failure (MLXHuggingFaceMacros)
          python3 -c "
          import re
          with open('project.base.yml') as f: content = f.read()
          # Remove package declarations
          for pkg in ['mlx-swift-lm', 'swift-huggingface', 'swift-transformers']:
              pattern = r'  ' + pkg + r':\n    url:.*?\n    (from|version):.*?\n'
              content = re.sub(pattern, '', content)
          # Remove target dependency lines
          for dep in ['mlx-swift-lm', 'swift-huggingface', 'swift-transformers']:
              pattern = r'      - package: ' + dep + r'\n        product:.*?\n'
              content = re.sub(pattern, '', content)
          with open('project.base.yml', 'w') as f: f.write(content)
          print('Stripped MLX/HF deps from project.base.yml')
          "
          # Remove source files that import MLX
          rm -f OpenGlasses/Sources/Services/LocalLLMService.swift
          rm -f OpenGlasses/Sources/Models/Gemma4Text.swift
          # Comment out MLX imports in remaining files
          sed -i.bak 's/^import MLXLLM/\/\/ import MLXLLM  -- removed for remote-only build/' OpenGlasses/Sources/OpenGlassesApp.swift
          # Comment out any references to removed types
          find OpenGlasses/Sources -name "*.swift" -exec sed -i.bak 's/Gemma4Text/\/\/ Gemma4Text -- removed/' {} \;
          find OpenGlasses/Sources -name "*.swift" -exec sed -i.bak 's/LocalLLMService/\/\/ LocalLLMService -- removed/' {} \;
          echo "Stripped on-device ML source files"

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          # Create project.local.yml with team ID
          cat > project.local.yml << 'YML'
          options:
            developmentTeam: VLYY93HRG2
          targets:
            OpenGlasses:
              settings:
                base:
                  DEVELOPMENT_TEAM: VLYY93HRG2
            GlassesActivityWidget:
              settings:
                base:
                  DEVELOPMENT_TEAM: VLYY93HRG2
          YML
          OPENGLASSES_SKIP_WATCH=1 OPENGLASSES_SKIP_TESTS=1 ./Scripts/generate-xcodeproj.sh

      - name: Set up code signing
        script: |
          xcode-project use-profiles \
            --project $CM_BUILD_DIR/OpenGlasses.xcodeproj

      - name: Set build number
        script: |
          cd $CM_BUILD_DIR
          agvtool new-version -all "${BUILD_NUMBER}"

      - name: Build iOS App
        script: |
          cd $CM_BUILD_DIR
          xcodebuild \
            -project OpenGlasses.xcodeproj \
            -scheme OpenGlasses \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/OpenGlasses.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM_ID}" \
            PRODUCT_BUNDLE_IDENTIFIER=com.ironclad.visionclaw \
            PROVISIONING_PROFILE_SPECIFIER="IronClaw Vision App Store"

      - name: Export IPA
        script: |
          cd $CM_BUILD_DIR
          PROFILE_UUID=$(/usr/bin/security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | grep -A1 UUID | grep -v UUID | head -1 | sed 's/<[^>]*>//g' | tr -d ' \t')
          echo "Using profile UUID: $PROFILE_UUID"
          mkdir -p build/IPA
          cat > build/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${DEVELOPMENT_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ironclad.visionclaw</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath build/OpenGlasses.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/IPA

    artifacts:
      - build/IPA/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - kylelalexander@outlook.com
        notify:
          success: true
          failure: true
