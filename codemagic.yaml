workflows:
  openglasses-ironclad:
    name: OpenGlasses IronClad
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Alfred

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ironclad.visionclaw
      vars:
        SCHEME: OpenGlasses
        DEVELOPMENT_TEAM_ID: "VLYY93HRG2"
        BUILD_NUMBER: "1"
        ALFRED_GATEWAY_URL: "http://192.168.1.132:18789"
        OPENCLAW_HOST: "http://192.168.1.132"
        OPENCLAW_PORT: "18789"
        OPENCLAW_GATEWAY_TOKEN: "ef54338db231cbb6814f33b5adab687987494ed285fca503"
        VL72B_ENDPOINT: "http://192.168.1.136:8001/v1"
        DEEPSEEK_ENDPOINT: "http://192.168.1.137:8001/v1"
        GLM51_ENDPOINT: "https://flbsh4qgrq58n6-8000.proxy.runpod.net/v1"
        META_APP_ID: "YOUR_META_APP_ID"
        META_CLIENT_TOKEN: "AR|YOUR_META_APP_ID|YOUR_CLIENT_TOKEN_HASH"
      xcode: "26.0"
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
        - pattern: ironclad

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Prepare project for remote-only build
        script: |
          cd $CM_BUILD_DIR
          echo "=== Build dir: $(pwd) ==="
          echo "=== Listing MLX-dependent files ==="
          find . -name "Gemma4Text.swift" -o -name "LocalLLMService.swift" -o -name "LocalModelManagerView.swift" -o -name "LLMService.swift" -o -name "AgenticFeaturesView.swift" | head -20

          # 1. Remove MLX/HF/SwiftTransformers from project.base.yml
          python3 << 'PYEOF'
          import re
          with open('project.base.yml') as f:
              content = f.read()
          for pkg in ['mlx-swift-lm', 'swift-huggingface', 'swift-transformers']:
              pattern = r'  ' + pkg + r':\n    url:.*?\n    (from|version):.*?\n'
              content = re.sub(pattern, '', content)
          for dep in ['mlx-swift-lm', 'swift-huggingface', 'swift-transformers']:
              pattern = r'      - package: ' + dep + r'\n        product:.*?\n'
              content = re.sub(pattern, '', content)
          content = content.replace('com.apple.developer.homekit: true', '# removed')
          content = content.replace('com.apple.developer.carplay-voice-based-conversation: true', '# removed')
          content = content.replace('com.apple.developer.kernel.increased-memory-limit: true', '# removed')
          content = re.sub(r'        com\.apple\.security\.application-groups:\n          - group\.com\.openglasses\.app\n', '', content)
          with open('project.base.yml', 'w') as f:
              f.write(content)
          print('Updated project.base.yml')
          PYEOF

          # 2. Remove ALL source files that import MLX/HF - use find to be sure
          echo "=== Removing MLX-dependent files ==="
          find . -name "Gemma4Text.swift" -type f -delete -print
          find . -name "LocalLLMService.swift" -type f -delete -print
          find . -name "LocalModelManagerView.swift" -type f -delete -print
          find . -name "LLMService.swift" -type f -delete -print
          find . -name "AgenticFeaturesView.swift" -type f -delete -print
          find . -name "ModelFormView.swift" -type f -delete -print
          find . -name "AgentScheduler.swift" -type f -delete -print
          find . -name "SettingsView.swift" -type f -delete -print
          find . -name "VoiceTab.swift" -type f -delete -print

          # 3. Stub LLMService
          cat > OpenGlasses/Sources/Services/LLMService.swift << 'STUB'
          import Foundation
          @MainActor
          class LLMService: ObservableObject {
              static let shared = LLMService()
              var isModelLoaded: Bool { true }
              var isLoading: Bool { false }
              func loadModel() async { }
              func generate(_ prompt: String) async -> String { "" }
          }
          STUB

          # 4. Remove MLX imports from ALL remaining Swift files
          find OpenGlasses/Sources -name "*.swift" -exec sed -i '' 's/^import MLXLLM/\/\/ import MLXLLM/' {} \;
          find OpenGlasses/Sources -name "*.swift" -exec sed -i '' 's/^import MLX$/\/\/ import MLX/' {} \;
          find OpenGlasses/Sources -name "*.swift" -exec sed -i '' 's/^import HuggingFace/\/\/ import HuggingFace/' {} \;
          find OpenGlasses/Sources -name "*.swift" -exec sed -i '' 's/^import Tokenizers/\/\/ import Tokenizers/' {} \;
          find OpenGlasses/Sources -name "*.swift" -exec sed -i '' 's/Gemma4Text/\/\/ Gemma4Temp/' {} \;
          find OpenGlasses/Sources -name "*.swift" -exec sed -i '' 's/LocalLLMService/\/\/ LocalLLMService/' {} \;
          find OpenGlasses/Sources -name "*.swift" -exec sed -i '' 's/LocalModelManagerView/\/\/ LocalModelManagerView/' {} \;
          find OpenGlasses/Sources -name "*.swift" -exec sed -i '' 's/AgenticFeaturesView/\/\/ AgenticFeaturesView/' {} \;
          find OpenGlasses/Sources -name "*.swift" -exec sed -i '' 's/ModelFormView/\/\/ ModelFormView/' {} \;
          find OpenGlasses/Sources -name "*.swift" -exec sed -i '' 's/AgentScheduler/\/\/ AgentScheduler/' {} \;
          find OpenGlasses/Sources -name "*.swift" -exec sed -i '' 's/SettingsView/\/\/ SettingsView/' {} \;
          find OpenGlasses/Sources -name "*.swift" -exec sed -i '' 's/VoiceTab/\/\/ VoiceTab/' {} \;

          echo "=== Verifying removal ==="
          find . -name "Gemma4Text.swift" -o -name "LocalLLMService.swift" | head -5
          grep -r "import MLX" OpenGlasses/Sources/ | head -5 || echo "No MLX imports remaining"
          echo "=== Done ==="

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          cat > project.local.yml << 'YML'
          options:
            developmentTeam: VLYY93HRG2
          targets:
            OpenGlasses:
              settings:
                base:
                  DEVELOPMENT_TEAM: VLYY93HRG2
            GlassesActivityWidget:
              settings:
                base:
                  DEVELOPMENT_TEAM: VLYY93HRG2
          YML
          OPENGLASSES_SKIP_WATCH=1 OPENGLASSES_SKIP_TESTS=1 ./Scripts/generate-xcodeproj.sh

      - name: Set up code signing
        script: |
          xcode-project use-profiles --project $CM_BUILD_DIR/OpenGlasses.xcodeproj

      - name: Set build number
        script: |
          cd $CM_BUILD_DIR
          agvtool new-version -all "${BUILD_NUMBER}"

      - name: Build iOS App
        script: |
          cd $CM_BUILD_DIR
          xcodebuild \
            -project OpenGlasses.xcodeproj \
            -scheme OpenGlasses \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/OpenGlasses.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM_ID}" \
            PRODUCT_BUNDLE_IDENTIFIER=com.ironclad.visionclaw \
            PROVISIONING_PROFILE_SPECIFIER="IronClaw Vision App Store"

      - name: Export IPA
        script: |
          cd $CM_BUILD_DIR
          PROFILE_UUID=$(/usr/bin/security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | grep -A1 UUID | grep -v UUID | head -1 | sed 's/<[^>]*>//g' | tr -d ' \t')
          echo "Using profile UUID: $PROFILE_UUID"
          mkdir -p build/IPA
          cat > build/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${DEVELOPMENT_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ironclad.visionclaw</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath build/OpenGlasses.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/IPA

    artifacts:
      - build/IPA/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - kylelalexander@outlook.com
        notify:
          success: true
          failure: true
