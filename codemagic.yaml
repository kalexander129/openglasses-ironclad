workflows:
  openglasses-ironclad:
    name: OpenGlasses IronClad
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Alfred

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ironclad.visionclaw
      vars:
        SCHEME: OpenGlasses
        DEVELOPMENT_TEAM_ID: "VLYY93HRG2"
        BUILD_NUMBER: "11"
        ALFRED_GATEWAY_URL: "http://192.168.1.132:18789"
        OPENCLAW_HOST: "http://192.168.1.132"
        OPENCLAW_PORT: "18789"
        OPENCLAW_GATEWAY_TOKEN: "ef54338db231cbb6814f33b5adab687987494ed285fca503"
        VL30B_ENDPOINT: "http://192.168.1.142:8000/v1"
        DEEPSEEK_ENDPOINT: "http://192.168.1.137:8001/v1"
        GLM51_ENDPOINT: "https://flbsh4qgrq58n6-8000.proxy.runpod.net/v1"
        META_APP_ID: "YOUR_META_APP_ID"
        META_CLIENT_TOKEN: "AR|YOUR_META_APP_ID|YOUR_CLIENT_TOKEN_HASH"
      xcode: "26.0"
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
        - pattern: ironclad

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Download Metal Toolchain
        script: |
          # Xcode 26 unbundled the Metal shader compiler — must download separately
          xcodebuild -downloadComponent MetalToolchain

      - name: Trust Swift Macros (CI workaround)
        script: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Patch project for CI build
        script: |
          cd $CM_BUILD_DIR
          # Remove capabilities the provisioning profile doesn't support
          python3 << 'PYEOF'
          import re
          with open('project.base.yml') as f:
              content = f.read()
          content = content.replace('com.apple.developer.homekit: true', '# removed for CI')
          content = content.replace('com.apple.developer.carplay-voice-based-conversation: true', '# removed for CI')
          content = content.replace('com.apple.developer.kernel.increased-memory-limit: true', '# removed for CI')
          content = re.sub(r'        com\.apple\.security\.application-groups:\n          - group\.com\.openglasses\.app\n', '', content)
          with open('project.base.yml', 'w') as f:
              f.write(content)
          print('Patched project.base.yml')
          PYEOF

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          # Remove widget target entirely from project.base.yml — no profile for it
          python3 << 'PYEOF'
          import re
          with open('project.base.yml') as f:
              content = f.read()
          # Remove the GlassesActivityWidget target definition
          widget_pattern = r'  GlassesActivityWidget:.*?(?=\n[a-z]|\nschemes:|$)'
          content = re.sub(widget_pattern, '', content, flags=re.DOTALL)
          # Remove widget dependency from OpenGlasses target
          content = re.sub(r'      - target: GlassesActivityWidget\n', '', content)
          with open('project.base.yml', 'w') as f:
              f.write(content)
          print('Removed GlassesActivityWidget from project.base.yml')
          PYEOF
          cat > project.local.yml << 'YML'
          options:
            developmentTeam: VLYY93HRG2
          targets:
            OpenGlasses:
              settings:
                base:
                  DEVELOPMENT_TEAM: VLYY93HRG2
                  PRODUCT_BUNDLE_IDENTIFIER: com.ironclad.visionclaw
          YML
          OPENGLASSES_SKIP_WATCH=1 OPENGLASSES_SKIP_TESTS=1 ./Scripts/generate-xcodeproj.sh

      - name: Set up code signing
        script: |
          xcode-project use-profiles --project $CM_BUILD_DIR/OpenGlasses.xcodeproj

      - name: Set build number
        script: |
          cd $CM_BUILD_DIR
          agvtool new-version -all "${BUILD_NUMBER}"

      - name: Build iOS App
        script: |
          cd $CM_BUILD_DIR
          # xcode-project build-ipa handles SPM signing conflicts properly
          # --archive-xcargs passes CODE_SIGN_STYLE=Manual only to archive, not SPM targets
          # This is the recommended fix per Codemagic blog for SPM + Xcode 14+ signing
          xcode-project build-ipa \
            --project OpenGlasses.xcodeproj \
            --scheme OpenGlasses \
            --archive-xcargs "CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="

      # xcode-project build-ipa handles both archive and export automatically
      # No separate export step needed — IPA is at build/ios/ipa/OpenGlasses.ipa

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - kylelalexander@outlook.com
        notify:
          success: true
          failure: true
